name: Build IncogniaBypass

on:
  workflow_dispatch:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo -S -p '' apt-get update
          sudo -S -p '' apt-get install -y git curl make wget libxml2-utils libplist-utils

      - name: Clean old installations
        run: |
          sudo -S -p '' rm -rf /usr/local/theos

      - name: Clone THEOS
        run: |
          sudo -S -p '' git clone --depth 1 --recursive https://github.com/theos/theos.git /usr/local/theos
          sudo -S -p '' chmod -R 755 /usr/local/theos

      - name: Remove sdks and toolchain from THEOS
        run: |
          sudo -S -p '' rm -rf /usr/local/theos/sdks /usr/local/theos/toolchain

      - name: Clone SDKs
        run: |
          sudo -S -p '' git clone --depth 1 https://github.com/theos/sdks.git /usr/local/theos/sdks

      - name: Install Toolchain
        run: |
          sudo -S -p '' mkdir -p /usr/local/theos/toolchain
          sudo -S -p '' git clone --depth 1 https://github.com/kabiroberai/swift-toolchain-linux.git /tmp/toolchain-tmp
          ls -la /tmp/toolchain-tmp/
          sudo -S -p '' cp -r /tmp/toolchain-tmp/* /usr/local/theos/toolchain/
          sudo -S -p '' rm -rf /tmp/toolchain-tmp
          sudo -S -p '' chmod -R 755 /usr/local/theos/toolchain

      - name: Build Tweak
        run: |
          export PATH="/usr/local/theos/bin:$PATH"
          export THEOS=/usr/local/theos
          export THEOS_MAKE_PATH=/usr/local/theos/makefiles
          make package

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: IncogniaBypass
          path: |
            *.deb
            *.ipa
            packages/*.deb

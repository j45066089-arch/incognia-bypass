name: Build IncogniaBypass

on:
  workflow_dispatch:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo -S -p '' apt-get update
          sudo -S -p '' apt-get install -y git curl make wget libxml2-utils libplist-utils

      - name: Clone THEOS and SDKs
        run: |
          sudo -S -p '' rm -rf /usr/local/theos /usr/local/theos/sdks
          sudo -S -p '' git clone --depth 1 --recursive https://github.com/theos/theos.git /usr/local/theos
          sudo -S -p '' chmod -R 755 /usr/local/theos
          sudo -S -p '' git clone --depth 1 https://github.com/theos/sdks.git /usr/local/theos/sdks

      - name: Build Tweak
        run: |
          export PATH="/usr/local/theos/bin:$PATH"
          export THEOS=/usr/local/theos
          export THEOS_MAKE_PATH=/usr/local/theos/makefiles
          make package

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: IncogniaBypass
          path: |
            *.deb
            *.ipa
            packages/*.deb

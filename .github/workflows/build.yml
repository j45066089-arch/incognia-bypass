name: Build IncogniaBypass

on:
  workflow_dispatch:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup THEOS
        uses: theos-actions/setup@v2

      - name: Build Tweak
        run: |
          make package

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: IncogniaBypass
          path: |
            *.deb
            *.ipa
            packages/*.deb

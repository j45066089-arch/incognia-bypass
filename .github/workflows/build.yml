name: Build IncogniaBypass

on:
  workflow_dispatch:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl make wget

      - name: Install THEOS
        run: |
          git clone --depth 1 https://github.com/theos/theos.git /usr/local/theos
          cd /usr/local/theos
          ./script/install
          export PATH="/usr/local/theos/bin:$PATH"
          export THEOS=/usr/local/theos
          make update-sdks

      - name: Install Toolchain
        run: |
          cd /usr/local/theos
          git clone --depth 1 https://github.com/theos/toolchain.git
          cd toolchain
          make
          make install

      - name: Build Tweak
        run: |
          export PATH="/usr/local/theos/bin:$PATH"
          export THEOS=/usr/local/theos
          export THEOS_MAKE_PATH=/usr/local/theos/makefiles
          cd /usr/local/theos
          make update-sdks
          cd $GITHUB_WORKSPACE
          make package

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: IncogniaBypass
          path: |
            *.deb
            *.ipa
            packages/*.deb
